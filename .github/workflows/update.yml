name: Daily Proxy Collection

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

concurrency:
  group: proxy-update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python main.py

      - name: Commit and push updated lists
        run: |
          git config user.name "Delta-Kronecker"
          git config user.email "diracdeltain0@gmail.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update proxy lists $(date -u +'%Y-%m-%d')"
            git push
          fi
